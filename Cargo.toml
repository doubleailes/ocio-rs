[package]
name = "ocio"
version = "0.2.1"
edition = "2021"
license = "MIT AND BSD-3-Clause"
description = "A pure Rust port of OpenColorIO, the color management framework for visual effects and animation."
repository = "https://github.com/doubleailes/ocio-rs"
readme = "README.md"
keywords = ["color", "ocio", "vfx", "lut", "aces"]
categories = ["graphics", "multimedia::images"]
# Largest test fixtures, left out to keep the published crate small: the
# tests using them skip when they are missing.
exclude = [
    "tests/data/files/spi_ocio_srgb_test.spi3d",
    "tests/data/files/clf/aces_to_video_with_look.clf",
    "tests/data/files/photo_default_16fpto16fp.lut",
    "tests/data/files/clf/lut1d_long.clf",
    "tests/data/files/lustre_33x33x33.3dl",
]

[lib]
name = "ocio"
path = "src/lib.rs"

[dependencies]
half = "2"
md5 = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1"
yaml-rust2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]

[workspace]
members = [".", "tools"]
