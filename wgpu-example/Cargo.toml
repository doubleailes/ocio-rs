[package]
name = "ocio-wgpu-example"
version = "0.0.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Runs the WGSL shaders generated by the ocio crate with wgpu and compares them with the CPU processors."
publish = false

[dependencies]
ocio = { path = ".." }
wgpu = "30"
pollster = "0.4"

# Standalone: not a member of the ocio workspace, so building the library
# never pulls wgpu.
[workspace]
